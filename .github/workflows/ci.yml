name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Frontend — lint, typecheck, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run build

      - name: Worker — typecheck, test
        working-directory: worker
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --run

      - name: Dataset schema validation
        run: npx tsx scripts/validate-dataset.ts
