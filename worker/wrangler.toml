name = "food-calendar-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "food-calendar-db"
database_id = "REPLACE_AFTER_CREATE"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "food-calendar-media"

[observability]
enabled = true

[vars]
CORS_ORIGIN = ""

# Cache API responses at the edge
[triggers]
# routes added after custom domain is configured
